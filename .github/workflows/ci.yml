name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # RLS 교차 테스트용 일회용 Postgres (로컬에서 검증한 것과 같은 17 버전)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: ledgie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app_user:ci_pw@localhost:5432/ledgie
      DATABASE_URL_OWNER: postgres://postgres:dev@localhost:5432/ledgie
      APP_DB_PASSWORD: ci_pw
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
